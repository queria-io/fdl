[project]
name = "fdl"
version = "0.11.0"
description = "Versions of a DuckLake catalog on object storage, kept the way Git keeps commits"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "flo8s" }]
dependencies = [
    "duckdb>=1.5.2,<2.0",
    "typer>=0.15",
]

[project.optional-dependencies]
# S3 and S3-compatible stores (R2 and others). A folder needs nothing extra,
# and tools that bring their own store do not pull boto3 in.
s3 = ["boto3>=1.36"]

[project.urls]
Homepage = "https://fdl.flo8s.com/"
Documentation = "https://fdl.flo8s.com/"
Repository = "https://github.com/queria-io/fdl"
Changelog = "https://github.com/queria-io/fdl/blob/main/CHANGELOG.md"

[project.scripts]
fdl = "fdl.cli:main"



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdl"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
major_on_zero = false



[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "moto[s3]>=5.0",
    "zensical>=0.0.29",
    "mkdocstrings[python]>=1.0.3",
]
